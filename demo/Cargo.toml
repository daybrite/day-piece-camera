[package]
name = "camera-demo"
version = "0.1.0"
edition = "2024"
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"
publish = false

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/project-structure).
default = ["mock"]
uikit = ["day/uikit"]
mdc = ["day/mdc"]
arkui = ["day/arkui"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
# The bare canonical URL, no ref: with no lock committed CI resolves day afresh at the tip of
# main on every run. See ../Cargo.toml for why a ref would double the graph.
day = { git = "https://github.com/daybrite/day.git" }
# The piece under test, by path: a change to the piece and to the demo land in one pull request
# and one CI run. An app depends on it from git instead:
#     day-piece-camera = { git = "https://github.com/daybrite/day-piece-camera.git" }
day-piece-camera = { path = ".." }
# The page asks for the camera permission itself, before the viewfinder starts.
day-part-permissions = { git = "https://github.com/daybrite/day.git" }
# Shows the last photo from its bytes.
day-piece-remote-image = { git = "https://github.com/daybrite/day.git" }

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git" }

[workspace]
