# Take a photo. Opt-in, and deliberately NOT the CI script: the viewfinder needs the camera
# permission, which only an OS dialog dayscript cannot dismiss can grant. Grant it out of band
# first — on Android
#
#     adb shell pm grant dev.daybrite.camerademo android.permission.CAMERA
#
# on the iOS Simulator
#
#     xcrun simctl privacy <udid> grant camera dev.daybrite.camerademo
#
# — then this script proves the capture path: the session runs, the shutter writes a JPEG into
# the app's cache, and the page shows it. The Android emulator's virtual camera makes the whole
# path real; the iOS Simulator has no capture device and reports `unavailable`, so run this one
# on Android or on a device.
name: camera-capture
description: Take a photo, with the camera permission already granted.
flow:
  - wait_for: { id: camera-view }
  # The permission was granted out of band, so the viewfinder started at build. The emulator's
  # camera takes a moment to open.
  - pause: { secs: 5 }
  - assert_text: { id: camera-state, text: "running" }
  - screenshot: camera-running
  - tap: { id: camera-shoot }
  - wait_for: { id: camera-photo, timeout_secs: 20 }
  - screenshot: camera-photo
  # The other camera, live.
  - tap: { id: camera-flip }
  - pause: { secs: 3 }
  - assert_text: { id: camera-state, text: "running" }
  - screenshot: camera-front
