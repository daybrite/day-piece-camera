# Take a photo. The viewfinder needs the camera permission, which only an OS dialog dayscript
# cannot dismiss can grant, so launch with it already granted: `--grant camera` marks it on the
# device between the install and the start, and CI's Android leg does exactly that
# (`grant-permissions` in ../../.github/workflows/ci.yml) and runs this script there.
#
#     day launch -p android-mdc --grant camera --script dayscript/camera-capture.yaml
#
# Then this script proves the capture path: the session runs, the shutter writes a JPEG into
# the app's cache, and the page shows it. The Android emulator's virtual camera makes the whole
# path real. The iOS Simulator has no camera at all, so `--grant camera` is refused there; on
# an iPhone, allow the permission once by hand and run this script without the flag.
name: camera-capture
description: Take a photo, with the camera permission already granted.
flow:
  - wait_for: { id: camera-view }
  # The permission was granted at launch, so the viewfinder started at build. The emulator's
  # camera takes a moment to open.
  - pause: { secs: 5 }
  - assert_text: { id: camera-state, text: "running" }
  - screenshot: camera-running
  - tap: { id: camera-shoot }
  - wait_for: { id: camera-photo, timeout_secs: 20 }
  - screenshot: camera-photo
  # The other camera, live.
  - tap: { id: camera-flip }
  - pause: { secs: 3 }
  - assert_text: { id: camera-state, text: "running" }
  - screenshot: camera-front
