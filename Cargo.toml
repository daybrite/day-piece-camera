[package]
name = "day-piece-camera"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A camera viewfinder with photo capture for Day apps on iOS, Android and HarmonyOS"
repository = "https://github.com/daybrite/day-piece-camera"
license = "MPL-2.0"

# An external Day Piece (https://daybrite.dev/contributing/extending): a cross-platform front end in Rust
# (src/lib.rs) plus a native camera behind it on each mobile platform, registered link-time into
# each backend's renderer slice without touching any day crate:
#   iOS       — AVFoundation through this crate's Swift shim   ([package.metadata.day.ios])
#   Android   — CameraX through this crate's Java class         ([package.metadata.day.android])
#   HarmonyOS — the NDK camera kit through this crate's C shim, behind an ArkTS XComponent
#               surface                                          ([package.metadata.day.ohos], build.rs)
#
# Daybrite-owned dependencies accept every stable 0.x release. Apps retain a tested
# dependency set with Cargo.lock; updating it may require source changes.

[features]
uikit = ["dep:day-toolkit-uikit", "dep:objc2", "dep:objc2-ui-kit"]
material = ["dep:day-toolkit-material", "dep:day-platform-android"]
arkui = ["dep:day-toolkit-arkui", "dep:cc"]
# The desktops and the web have no camera arm. Each feature exists so `day` can union
# `<pkg>/<backend>` into any app build uniformly; the kind then falls back to day's placeholder
# leaf, and `support()` answers Unsupported so an app can hide its own UI.
appkit = []
gtk = []
qt = []
xaml = []
dom = []
mock = []

[package.metadata.day]
# Accept the pre-1.0 series; source compatibility between releases is not guaranteed.
compat = "0.*"

# Backends this piece carries a [features] entry for. `day` unions `<pkg>/<backend>` into an
# app build, so an app depends on this piece with a plain `{ git = "…" }` line, with no
# per-backend feature fan-out in its Cargo.toml.
[package.metadata.day.piece]
backends = ["appkit", "gtk", "qt", "uikit", "material", "xaml", "arkui", "dom", "mock"]

# The portable permission this piece needs (https://daybrite.dev/docs/how-to/guide-permissions). `day
# build` turns it into `android.permission.CAMERA`, `NSCameraUsageDescription` and
# `ohos.permission.CAMERA`; the app supplies the reason (`[permissions] camera = "…"` in Day.toml,
# or `permission_camera` in its catalogs); on iOS and HarmonyOS a build without one fails
# naming this crate.
[package.metadata.day.permissions]
uses = ["camera"]

[dependencies]
day-spec = "0.*"
day-core = "0.*"
day-pieces = "0.*"
day-reactive = "0.*"
# The piece checks the camera permission before it starts a session, and asks for it when the
# app opts in with `.auto_request()`. Headless, so it rides on every target.
day-part-permissions = "0.*"
day-toolkit-uikit = { version = "0.*", optional = true }
day-toolkit-material = { version = "0.*", optional = true }
day-platform-android = { version = "0.*", optional = true }
day-toolkit-arkui = { version = "0.*", optional = true }
log = "0.4"
linkme = "0.3"
objc2 = { version = "0.6", optional = true }
objc2-ui-kit = { version = "0.3", optional = true, features = ["UIView", "UIResponder"] }

[build-dependencies]
# Compiles platform/harmony/native/day_camera.cpp against the OpenHarmony sysroot for the arkui arm only.
cc = { version = "1", optional = true }

[dev-dependencies]
day-mock = "0.*"

# --- Android backend contribution ---
# The day CLI reads this from `cargo metadata` and folds it into the app's Gradle build.
[package.metadata.day.android]
java = ["src/DayCamera.java"]
# CameraX: the camera2 backend, lifecycle binding, and the PreviewView widget.
gradle-dependencies = [
    "androidx.camera:camera-core:1.5.1",
    "androidx.camera:camera-camera2:1.5.1",
    "androidx.camera:camera-lifecycle:1.5.1",
    "androidx.camera:camera-view:1.5.1",
]

# --- iOS backend contribution ---
# `day build` (ios-uikit) reads this from `cargo metadata`, compiles the `swift` shim sources into
# a generated local SwiftPM package, and links the frameworks into the app.
[package.metadata.day.ios]
swift = ["platform/ios/swift"]
frameworks = ["AVFoundation"]

# --- HarmonyOS backend contribution ---
# The ArkTS half: the XComponent surface the NDK camera renders its preview into. `day build`
# stages it into the app's hvigor project; the C half is compiled by build.rs.
[package.metadata.day.ohos]
ets = ["platform/harmony/ets"]
